<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OpenScanner</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #111;
    color: #eee;
    font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  #gl {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: block;
  }
  #hud {
    position: absolute;
    top: 0; left: 0;
    padding: 10px 14px;
    font-size: 13px;
    line-height: 1.5;
    background: rgba(0, 0, 0, 0.45);
    border-bottom-right-radius: 6px;
    pointer-events: none;
    white-space: pre;
  }
  #hud .label { color: #888; }
  #hud .value { color: #fff; font-weight: 600; }
  #hud .warn { color: #e05d44; }
  #hud .ok { color: #4caf7d; }

  #controls {
    position: absolute;
    bottom: 0; left: 0;
    padding: 12px 14px;
    font-size: 13px;
    line-height: 1.5;
    background: rgba(0, 0, 0, 0.45);
    border-top-right-radius: 6px;
    min-width: 230px;
  }
  #controls .row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  #controls .row:last-child { margin-bottom: 0; }
  #controls button {
    background: #2a2a2e;
    color: #eee;
    border: 1px solid #444;
    border-radius: 4px;
    padding: 5px 10px;
    font-size: 13px;
    cursor: pointer;
  }
  #controls button:hover:not(:disabled) { background: #3a3a3e; }
  #controls button:disabled { opacity: 0.4; cursor: default; }
  #controls button.active { background: #3d6fd1; border-color: #3d6fd1; }
  #controls label { color: #ccc; display: flex; align-items: center; gap: 6px; }
  #controls input[type="range"] { flex: 1; }
  #controls .exposure-value { color: #fff; width: 3em; text-align: right; }
  #controls .note { color: #888; font-size: 11px; margin-top: 2px; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud">connecting...</div>
<div id="controls">
  <div class="row">
    <button id="btn-start-pause" disabled>Start</button>
    <button id="btn-finish" disabled>Finish</button>
    <button id="btn-camera-mode">Camera: orbit</button>
  </div>
  <div class="row">
    <label><input type="checkbox" id="auto-exposure" checked disabled /> Auto exposure</label>
  </div>
  <div class="row">
    <label style="flex: 1">
      Brightness
      <input type="range" id="exposure" min="1" max="1000" value="900" disabled />
    </label>
    <span class="exposure-value" id="exposure-value">900</span>
  </div>
  <div class="row">
    <span>Scanner FOV</span>
    <button id="fov-normal" data-fov="normal" disabled>Normal</button>
    <button id="fov-wide" data-fov="wide" disabled>Wide</button>
  </div>
  <div class="note" id="fov-note"></div>
</div>
<script>
  // Plain "app.js" got stuck in the browser's disk cache during
  // development (a dev static server here doesn't send cache-control
  // headers, so edits silently stopped taking effect even across new
  // tabs/reloads) — load it with a cache-busting query param every time
  // instead of relying on a <script src> tag.
  function loadScript(src, onload) {
    const el = document.createElement("script");
    el.src = src + "?t=" + Date.now();
    el.onload = onload;
    document.body.appendChild(el);
  }
  loadScript("frame_protocol.js", () => {
    loadScript("frame_age.js", () => {
      loadScript("render/webgl2_renderer.js", () => {
        loadScript("render/webgpu_renderer.js", () => {
          loadScript("app.js");
        });
      });
    });
  });
</script>
</body>
</html>

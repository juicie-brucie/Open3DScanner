<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OpenScanner</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #111;
    color: #eee;
    font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  #gl {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: block;
  }
  #hud {
    position: absolute;
    top: 0; left: 0;
    padding: 10px 14px;
    font-size: 13px;
    line-height: 1.5;
    background: rgba(0, 0, 0, 0.45);
    border-bottom-right-radius: 6px;
    pointer-events: none;
    white-space: pre;
  }
  #hud .label { color: #888; }
  #hud .value { color: #fff; font-weight: 600; }
  #hud .warn { color: #e05d44; }
  #hud .ok { color: #4caf7d; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud">connecting...</div>
<script src="app.js"></script>
</body>
</html>
